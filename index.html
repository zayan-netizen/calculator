<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <title>Calculator</title>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.2.0/math.js"></script>
        <script type="text/javascript">

            function addlog(msg){
                const ul = document.getElementById("log");
                const li = document.createElement("li");
                const message_text_node = document.createTextNode(msg);
                li.appendChild(message_text_node);
                ul.appendChild(li);
            }

            function calculate(){
                expression = document.getElementById("expression").value;
                console.log(`Expression: ${expression}`);
                if (expression){
                    try{
                        answer = eval(expression);
                        document.getElementById("expression").value = answer;
                        addlog(`${expression} = ${answer}`)
                    } catch(e) {
                        console.log("Bad expression");
                        addlog("Accepts only integer, don't type string.")
                    };
                };
            };

            
            function math_js_calculate(){
                expression = document.getElementById("expression").value;
                console.log(`Expression: ${expression}`);
                if (expression){
                    try{
                        answer = math.evaluate(expression);
                        document.getElementById("expression").value = answer;
                        addlog(`${expression} = ${answer}`)
                    } catch(e) {
                        console.log("Bad expression");
                        addlog("Accepts only integer, don't type string.")
                    };
                };
            };

            function initialize_app(){
                calculate_button = document.getElementById("cal_but");
                calculate_button.addEventListener("click", math_js_calculate);
            }

        </script>
    </head>

    <body> 
        <header>
            <h1 class="text-center m-5">Calculator</h1>
        </header>
        <div class="container row">
            <div class="col"></div>
            <div class="col">
                <input type="text" class="form-control m-5" id="expression" placeholder="3 * 5, type you numbers to be calculated">
                <button class="btn btn-primary" id="cal_but">Calculate</button>
                <ul id="log"></ul>
            </div>
            <div class="col"></div>
        </div>
    </body>

    <script>
        initialize_app()
    </script>
</html>
